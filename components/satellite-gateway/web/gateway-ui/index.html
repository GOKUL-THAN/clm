<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLM Gateway</title>
    <!-- No Keycloak JS adapter: the CDN build is blocked by the corporate proxy
         and Keycloak 24's bundled /auth/js/keycloak.js is a Node UMD module that
         cannot run in a browser. Auth uses the Direct Grant flow in app.js. -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #2563eb; --bg: #f1f5f9; --card: #fff; --border: #e2e8f0; --text: #1e293b; --muted: #64748b; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --sidebar-bg: #0f172a; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
        .sidebar { width: 220px; background: var(--sidebar-bg); color: #cbd5e1; min-height: 100vh; position: fixed; padding: 1.5rem 0; }
        .sidebar h1 { padding: 0 1.5rem 1rem; font-size: 1.1rem; color: #fff; border-bottom: 1px solid #334155; margin-bottom: 1rem; }
        .nav-item { display: block; padding: 0.6rem 1.5rem; color: #cbd5e1; text-decoration: none; font-size: 0.85rem; cursor: pointer; }
        .nav-item:hover { background: #1e293b; color: #fff; }
        .nav-item.active { background: var(--primary); color: #fff; }
        .main { margin-left: 220px; flex: 1; }
        .topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .content { padding: 1.5rem 2rem; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.25rem; margin-bottom: 1rem; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat .value { font-size: 1.75rem; font-weight: 700; }
        .stat .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th { text-align: left; padding: 0.6rem; background: #f8fafc; border-bottom: 1px solid var(--border); font-weight: 600; color: var(--muted); font-size: 0.7rem; text-transform: uppercase; }
        td { padding: 0.6rem; border-bottom: 1px solid var(--border); }
        .btn { padding: 0.4rem 0.8rem; border-radius: 0.375rem; border: none; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .btn-primary { background: var(--primary); color: #fff; }
        .badge { padding: 0.15rem 0.4rem; border-radius: 0.25rem; font-size: 0.7rem; font-weight: 600; }
        .badge-active { background: #d1fae5; color: #065f46; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-expired { background: #fee2e2; color: #991b1b; }
        /* !important is deliberate. .hidden and .login-redirect are both
           single-class selectors, so they have identical specificity and the
           later rule wins on source order alone. .login-redirect sets
           display:flex below, which silently defeated classList.add('hidden')
           and left the login overlay covering the dashboard after a successful
           sign-in — the login appeared to do nothing. As a utility class,
           .hidden must beat whatever display a component sets. */
        .hidden { display: none !important; }
        .login-redirect { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .login-redirect p { color: var(--muted); margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="login-redirect" id="login-redirect">
        <div style="background:var(--card);border:1px solid var(--border);border-radius:1rem;padding:2.5rem;width:100%;max-width:380px">
            <h2 style="margin-bottom:0.25rem">CLM Gateway</h2>
            <p style="color:var(--muted);font-size:0.85rem;margin-bottom:1.5rem">Sign in with your CLM account</p>
            <div style="margin-bottom:0.75rem"><label style="display:block;font-size:0.75rem;font-weight:600;color:var(--muted);margin-bottom:0.25rem">Email</label><input type="email" id="gw-login-email" placeholder="admin@aiforgers.tech" style="width:100%;padding:0.5rem;border:1px solid var(--border);border-radius:0.375rem;font-size:0.85rem"></div>
            <div style="margin-bottom:0.75rem"><label style="display:block;font-size:0.75rem;font-weight:600;color:var(--muted);margin-bottom:0.25rem">Password</label><input type="password" id="gw-login-password" placeholder="Password" style="width:100%;padding:0.5rem;border:1px solid var(--border);border-radius:0.375rem;font-size:0.85rem"></div>
            <button class="btn btn-primary" style="width:100%;padding:0.6rem;margin-top:0.5rem" onclick="doGatewayLogin()">Sign In</button>
            <div id="gw-login-error" style="color:#ef4444;font-size:0.8rem;margin-top:0.5rem"></div>
        </div>
    </div>

    <aside class="sidebar">
        <h1>CLM Gateway</h1>
        <a class="nav-item active" onclick="navigate('dashboard')">Dashboard</a>
        <a class="nav-item" onclick="navigate('inventory')">Inventory</a>
        <a class="nav-item" onclick="navigate('lifecycle')">Lifecycle</a>
        <a class="nav-item" onclick="navigate('automation')">Automation</a>
        <a class="nav-item" onclick="navigate('authorities')">Certificate Authorities</a>
        <a class="nav-item" onclick="navigate('reports')">Reports</a>
        <a class="nav-item" onclick="navigate('discovery')">Discovery</a>
        <a class="nav-item" onclick="navigate('vsatellites')">vSatellites</a>
        <a class="nav-item" onclick="navigate('approvals')">Approvals</a>
        <a class="nav-item" onclick="navigate('deploy')">Deploy Certs</a>
        <a class="nav-item" onclick="navigate('monitoring')">Monitoring</a>
        <a class="nav-item" onclick="navigate('policies')">Certificate Policy</a>
        <a class="nav-item" onclick="navigate('audit')">Audit Log</a>
        <a class="nav-item" style="margin-top:2rem;border-top:1px solid #334155;padding-top:1rem" onclick="logout()">Logout</a>
    </aside>

    <div class="main">
        <div class="topbar">
            <h2 id="page-title">Dashboard</h2>
            <span id="user-info" style="font-size:0.85rem;color:var(--muted)"></span>
        </div>
        <div class="content" id="content-area"></div>
    </div>
    <!-- The version query is the only reliable cache eviction available here:
         a cache holding app.js?v=N cannot answer a request for v=N+1. Bump it
         on every change to this file's script. -->
    <script src="app.js?v=20260813-2"></script>
</body>
</html>
