server {
    listen 80;
    server_name _;

    # index.html and app.js must not be cached. Served without Cache-Control,
    # browsers reuse a stale app.js indefinitely and newly deployed UI appears
    # missing — the portal is one unversioned script, so a single stale file
    # hides every change.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location = /app.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ACME HTTP-01 validation. The CA fetches this over plain HTTP on port 80 for
    # the name being validated, so it must be reachable without authentication and
    # must not be redirected to HTTPS — a redirect is a validation failure.
    location /.well-known/acme-challenge/ {
        proxy_pass http://clm-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }

    # Gateway's own REST API, served by the clm-satellite binary.
    location /api/ {
        proxy_pass http://clm-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Proxy to the SaaS control plane API (avoids cross-origin requests, which
    # the corporate proxy blocks even with correct CORS headers).
    location /saas-api/ {
        proxy_pass http://35.154.6.28/api/;
        proxy_set_header Host 35.154.6.28;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy to the SaaS Keycloak so the portal can obtain a token same-origin.
    # Trailing slashes on both sides map /saas-auth/<x> -> /auth/<x>.
    location /saas-auth/ {
        proxy_pass http://35.154.6.28/auth/;
        proxy_set_header Host 35.154.6.28;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /health {
        proxy_pass http://clm-gateway:8080;
        proxy_set_header Host $host;
    }
}
