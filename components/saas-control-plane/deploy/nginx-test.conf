server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. nginx normally resolves an upstream hostname once at
    # startup and caches the IP forever, so recreating the clm-server or keycloak
    # container (which assigns it a new IP) made nginx return 502 until nginx was
    # itself restarted. Declaring a resolver and passing the upstream through a
    # variable forces re-resolution, so containers can be recreated independently.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Admin Portal SPA.
    #
    # index.html and app.js must NOT be cached. They were served with no
    # Cache-Control at all, so browsers reused a stale app.js indefinitely and
    # newly deployed pages appeared to be "not available" — the portal is a
    # single unversioned script, so one stale file hides every UI change.
    # These files are small and volume-mounted, so revalidating each load is cheap.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location = /app.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # Covers the SPA fallback, which serves index.html for unknown paths.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # CLM API proxy
    location /api/ {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }

        set $clm_upstream clm-server;
        proxy_pass http://$clm_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Keycloak proxy (accessible from browser).
    # No trailing slash on proxy_pass: Keycloak runs with
    # KC_HTTP_RELATIVE_PATH=/auth, so it expects to receive the /auth prefix.
    # A trailing slash here would strip it and every realm URL would 404.
    location /auth/ {
        # No URI component after the port, so the original /auth/... path is
        # forwarded unchanged — Keycloak runs with KC_HTTP_RELATIVE_PATH=/auth
        # and expects to receive that prefix.
        set $kc_upstream keycloak;
        proxy_pass http://$kc_upstream:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Health check
    location /health {
        set $clm_health_upstream clm-server;
        proxy_pass http://$clm_health_upstream:8080;
        proxy_set_header Host $host;
    }
}
