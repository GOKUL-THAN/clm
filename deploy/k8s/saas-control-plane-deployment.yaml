apiVersion: v1
kind: Namespace
metadata:
  name: clm-production
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clm-saas-control-plane
  namespace: clm-production
  labels:
    app.kubernetes.io/name: clm-control-plane
    app.kubernetes.io/part-of: enterprise-clm
    app.kubernetes.io/component: control-plane
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: clm-control-plane
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clm-control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: clm-control-plane-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane-server
          image: ghcr.io/m2p/clm-control-plane:v3.4.0
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http-rest
              containerPort: 8080
              protocol: TCP
            - name: grpc-mtls
              containerPort: 9090
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clm-database-secret
                  key: connection_string
            - name: KEYCLOAK_URL
              value: "https://auth.clm.enterprise.internal"
            - name: KEYCLOAK_REALM
              value: "clm-realm"
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clm-keycloak-secret
                  key: client_secret
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-rest
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-rest
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 2
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: clm-control-plane-service
  namespace: clm-production
  labels:
    app.kubernetes.io/name: clm-control-plane
spec:
  type: ClusterIP
  ports:
    - name: http-rest
      port: 8080
      targetPort: http-rest
    - name: grpc-mtls
      port: 9090
      targetPort: grpc-mtls
  selector:
    app.kubernetes.io/name: clm-control-plane

